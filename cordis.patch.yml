# dsh-agent-frugality bundle patch: register the multi-agent frugality
# defense plugin on the host composition (tools + systemPrompt + llm).
#
# Applied over the dsh-base layer; later layers (the profile's own
# cordis.patch.yml and --patch overlays) can still address this row by id.
- insert:
    - id: dsh-agent-frugality
      name: 'dsh-agent-frugality'
